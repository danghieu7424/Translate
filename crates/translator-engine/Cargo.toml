[package]
name = "translator-engine"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
llm-client = { path = "../llm-client" }
vtt-core = { path = "../vtt-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
