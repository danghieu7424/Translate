[workspace]
members = [
    "crates/vtt-core",
    "crates/llm-client",
    "crates/translator-engine",
    "crates/vtt-cli",
]
resolver = "3"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
indicatif = "0.18"
llm-client = { path = "crates/llm-client" }
proptest = "1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
translator-engine = { path = "crates/translator-engine" }
vtt-core = { path = "crates/vtt-core" }
