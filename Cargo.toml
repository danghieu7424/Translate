[package]
name = "translate"
version = "0.1.0"
edition = "2024"
authors = ["Antigravity"]
description = "High-performance subtitle translation library powered by Tencent Hy-MT2 1.8B GGUF with vocabulary pronoun management and cli_gui_form TUI progress integration"
license = "MIT"

[dependencies]
cli_gui_form = { path = "./cli_gui_form" }
ratatui = "0.28"
crossterm = "0.28"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
futures-util = "0.3"

[[example]]
name = "demo_translate"
path = "examples/demo_translate.rs"

[[example]]
name = "demo_tui"
path = "examples/demo_tui.rs"
